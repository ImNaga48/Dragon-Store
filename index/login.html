<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Dragon Store</title>

  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="auth-body">

  <main class="auth-page">

    <!-- BRAND -->
    <a href="../index.html" class="auth-brand">

      <img
        src="../assets/logo.jpg"
        alt="Dragon Store"
      >

      <span>Dragon Store</span>

    </a>


    <!-- LOGIN CARD -->
    <section class="auth-card">

      <!-- BACK BUTTON -->
      <a
        href="../index.html"
        class="auth-back"
        aria-label="Kembali ke Beranda"
        title="Kembali ke Beranda"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M15 18l-6-6 6-6"></path>
        </svg>

      </a>


      <!-- HEADING -->
      <div class="auth-heading">

        <span>WELCOME BACK</span>

        <h1>Masuk</h1>

        <p>
          Masuk ke akun Dragon Store
          untuk melanjutkan.
        </p>

      </div>


      <!-- FORM -->
      <form id="loginForm">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          name="email"
          placeholder="nama@email.com"
          autocomplete="email"
          required
        >


        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          name="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >


        <button
          type="submit"
          class="auth-submit"
        >
          Masuk
        </button>

      </form>


      <!-- MESSAGE -->
      <p
        id="authMessage"
        class="auth-message"
      ></p>


      <!-- REGISTER LINK -->
      <div class="auth-switch">

        <span>Belum punya akun?</span>

        <a href="register.html">
          Buat akun baru
        </a>

      </div>

    </section>

  </main>


  <!-- SUPABASE / AUTH SCRIPT -->
  <script
    type="module"
    src="../java script/auth.js"
  ></script>

</body>
</html>
